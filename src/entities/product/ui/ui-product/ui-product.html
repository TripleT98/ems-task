@for (item of [1, 2, 3, 4, 5, 6]; track $index) {
    <div class="face" [className]="item">
        <div class="face__seam"></div>
        <div class="face__tape"></div>
        @if (item === 1) {
            <div class="face__label">
                <div>
                    <div class="face__label id">#A-042</div>
                    <div class="face__label time">10:24:08</div>
                </div>
                <div class="face__label status">
                    <span class="face__label dot"></span>
                    <span>В очереди</span>
                </div>
            </div>
        }
    </div>
}
