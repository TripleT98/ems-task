@let prods = products();

<div tuiCardLarge appearance="floating" class="container">
    <ng-container [ngTemplateOutlet]="header" />
    <tui-scrollbar>
        @if (prods.length) {
            <div
                class="container__line"
                [style.--pop-animation-duration]="POP_ANIMATION_DURATION + 'ms'"
            >
                @for (product of prods; track product.id) {
                    <div
                        class="container__product"
                        [class.container__product--fresh]="freshIds.has(product.id)"
                        animate.leave="container__product--leave"
                    >
                        <app-ui-product
                            [product]="product"
                            class="container__content"
                            [class.container__content--fresh]="freshIds.has(product.id)"
                            animate.leave="container__content--leave"
                        >
                            <ng-container
                                product-actions
                                [ngTemplateOutlet]="productAction"
                                [ngTemplateOutletContext]="{ product }"
                            />
                        </app-ui-product>
                    </div>
                }
            </div>
        } @else {
            <app-ui-empty-content [imageSize]="50" />
        }
    </tui-scrollbar>
    <ng-container [ngTemplateOutlet]="actions" />
</div>

<ng-template #header>
    <header
        tuiHeader
        class="container__header"
        [class.container__header--with-empty]="!prods.length"
    >
        <h3 tuiTitle>
            <span class="container__title">Очередь продуктов</span>
            <div tuiSubtitle class="container__subtitle">
                Продукты движутся от входного датчика к датчику отбраковки
            </div>
        </h3>

        <aside tuiAccessories class="container__statuses">
            @for (status of productStatutses; track status) {
                <app-ui-product-status class="status" [status]="status" />
            }
        </aside>
    </header>
</ng-template>

<ng-template #actions>
    <div class="container__actions">
        <app-next-tack-button />
        <app-clear-line-button />
    </div>
</ng-template>

<ng-template #productAction let-product="product">
    <app-remove-product-button [productId]="product.id" />
    <button
        appearance="flat"
        iconStart="@tui.ellipsis-vertical"
        tuiIconButton
        type="button"
        size="s"
        topRight
        tuiDropdownAuto
        [tuiDropdown]="content"
    ></button>
    <ng-template #content>
        <app-set-product-status-button
            [product]="product"
            [productStatuses]="[ProductStatus.CHECKED, ProductStatus.REJECTED]"
        />
    </ng-template>
</ng-template>
